apiVersion: v1
kind: ConfigMap
metadata:
  name: aiapp-tempo-config
  namespace: aiapp
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: aiapp
data:
  tempo.yml: |
    # Tempo 保存 Trace，帮助按一次用户操作排查跨服务链路。
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          # Collector 会通过 OTLP 把 Trace 转发到这里。
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    storage:
      trace:
        # 首版用本地存储，生产环境建议换对象存储。
        backend: local
        local:
          path: /tempo/traces
    metrics_generator:
      storage:
        path: /tempo/generator
---
apiVersion: v1
kind: Service
metadata:
  name: aiapp-tempo
  namespace: aiapp
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: aiapp
spec:
  ports:
    - name: http
      # Grafana 通过 aiapp-tempo:3200 查询 Trace。
      port: 3200
      targetPort: http
    - name: otlp-grpc
      # Collector 向 Tempo 写入 Trace 的 gRPC 入口。
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
  selector:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: aiapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiapp-tempo
  namespace: aiapp
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: aiapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
      app.kubernetes.io/part-of: aiapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
        app.kubernetes.io/part-of: aiapp
    spec:
      serviceAccountName: aiapp-workload
      containers:
        - name: tempo
          image: grafana/tempo:2.7.2
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/tempo/tempo.yml
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: data
              # emptyDir 适合开发环境；生产 Trace 应使用持久化存储。
              mountPath: /tempo
      volumes:
        - name: config
          configMap:
            name: aiapp-tempo-config
        - name: data
          emptyDir: {}
