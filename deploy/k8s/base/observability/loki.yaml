apiVersion: v1
kind: ConfigMap
metadata:
  name: aiapp-loki-config
  namespace: aiapp
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: aiapp
data:
  loki.yml: |
    # Loki 保存日志。日志内容必须先在应用侧脱敏，不能依赖 Loki 再清洗。
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          # 首版用本地文件系统，生产环境建议换对象存储。
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
---
apiVersion: v1
kind: Service
metadata:
  name: aiapp-loki
  namespace: aiapp
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: aiapp
spec:
  ports:
    - name: http
      # Grafana 通过 aiapp-loki:3100 查询日志。
      port: 3100
      targetPort: http
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: aiapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiapp-loki
  namespace: aiapp
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: aiapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/part-of: aiapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/part-of: aiapp
    spec:
      serviceAccountName: aiapp-workload
      containers:
        - name: loki
          image: grafana/loki:3.4.2
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/loki.yml
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              # emptyDir 适合开发环境；生产日志应使用持久化存储。
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: aiapp-loki-config
        - name: data
          emptyDir: {}
