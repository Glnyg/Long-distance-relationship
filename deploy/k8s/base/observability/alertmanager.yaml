apiVersion: v1
kind: ConfigMap
metadata:
  name: aiapp-alertmanager-config
  namespace: aiapp
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: aiapp
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: default
---
apiVersion: v1
kind: Service
metadata:
  name: aiapp-alertmanager
  namespace: aiapp
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: aiapp
spec:
  ports:
    - name: http
      port: 9093
      targetPort: http
  selector:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: aiapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiapp-alertmanager
  namespace: aiapp
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: aiapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
      app.kubernetes.io/part-of: aiapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: aiapp
    spec:
      serviceAccountName: aiapp-workload
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
      volumes:
        - name: config
          configMap:
            name: aiapp-alertmanager-config
