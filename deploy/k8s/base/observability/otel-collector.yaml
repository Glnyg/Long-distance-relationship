apiVersion: v1
kind: ConfigMap
metadata:
  name: aiapp-otel-collector-config
  namespace: aiapp
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: aiapp
data:
  otel-collector.yaml: |
    receivers:
      otlp:
        # 服务端 AIAPP.Observability 默认通过 OTLP 把日志、Trace、Metric 发到这里。
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        # batch 会把遥测数据合并后再导出，减少网络开销。
        timeout: 5s
      memory_limiter:
        # 防止 Collector 内存失控影响节点。
        check_interval: 1s
        limit_mib: 384

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    exporters:
      prometheus:
        # Prometheus 会抓取这个端口上的指标。
        endpoint: 0.0.0.0:9464
      otlp/tempo:
        # Trace 转发到 Tempo，用于按 correlation_id 排查链路。
        endpoint: aiapp-tempo:4317
        tls:
          insecure: true
      debug:
        # 首版保留 debug exporter 便于本地排障；生产环境可按需要关闭。
        verbosity: basic

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo, debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          # 首版日志先走 debug；接入 Loki exporter 前仍要保证日志内容已脱敏。
          exporters: [debug]
---
apiVersion: v1
kind: Service
metadata:
  name: aiapp-otel-collector
  namespace: aiapp
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: aiapp
spec:
  ports:
    - name: otlp-grpc
      # gRPC OTLP，.NET 默认常用端口。
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      # HTTP OTLP，便于其他客户端或代理接入。
      port: 4318
      targetPort: otlp-http
    - name: metrics
      port: 9464
      targetPort: metrics
  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: aiapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiapp-otel-collector
  namespace: aiapp
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: aiapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/part-of: aiapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: aiapp
    spec:
      serviceAccountName: aiapp-workload
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.124.1
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol/otel-collector.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 9464
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              # ConfigMap 挂载成 Collector 配置文件。
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: aiapp-otel-collector-config
