apiVersion: v1
kind: Secret
metadata:
  name: aiapp-identity-service-secret
  namespace: aiapp
type: Opaque
stringData:
  # PostgreSQL 连接串包含密码，生产环境必须由密钥系统注入，不能提交真实值。
  ConnectionStrings__Default: "Host=postgres;Port=5432;Database=aiapp;Username=CHANGE_ME;Password=CHANGE_ME"
  # JWT 签名密钥泄露会导致 token 可被伪造，示例值必须保留 CHANGE_ME。
  Jwt__SigningKey: "CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME"
