apiVersion: v1
kind: Secret
metadata:
  name: aiapp-rabbitmq-secret
  namespace: aiapp
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: aiapp
type: Opaque
stringData:
  # 示例账号密码，生产环境必须替换。
  RABBITMQ_DEFAULT_USER: aiapp
  RABBITMQ_DEFAULT_PASS: CHANGE_ME_RABBITMQ_PASSWORD
