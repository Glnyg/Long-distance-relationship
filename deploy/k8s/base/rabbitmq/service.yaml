apiVersion: v1
kind: Service
metadata:
  name: aiapp-rabbitmq
  namespace: aiapp
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: aiapp
spec:
  ports:
    - name: amqp
      # 业务服务通过 AMQP 端口发布和消费事件。
      port: 5672
      targetPort: amqp
    - name: management
      # 管理端口只建议内网访问，不应直接暴露公网。
      port: 15672
      targetPort: management
  selector:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: aiapp
