apiVersion: v1
kind: Service
metadata:
  name: aiapp-rabbitmq
  namespace: aiapp
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: aiapp
spec:
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
  selector:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: aiapp
