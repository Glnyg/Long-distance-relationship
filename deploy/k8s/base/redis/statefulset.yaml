apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aiapp-redis
  namespace: aiapp
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: aiapp
spec:
  # Redis 保存会话、在线状态、限流和短期缓存；不能作为唯一长期数据源。
  serviceName: aiapp-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: aiapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: aiapp
    spec:
      serviceAccountName: aiapp-workload
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          envFrom:
            - secretRef:
                name: aiapp-redis-secret
          command:
            # 开启 AOF，让 Redis 重启时尽量恢复最近写入的数据。
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            # 密码从 Secret 注入，避免硬编码。
            - "$(REDIS_PASSWORD)"
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: redis-data
              # AOF 文件写入 /data，需要持久卷保存。
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
