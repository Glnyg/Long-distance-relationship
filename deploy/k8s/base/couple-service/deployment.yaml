apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiapp-couple-service
  namespace: aiapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiapp-couple-service
  template:
    metadata:
      labels:
        app: aiapp-couple-service
    spec:
      serviceAccountName: aiapp
      containers:
        - name: couple-service
          image: CHANGE_ME/aiapp-couple-service:CHANGE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: aiapp-couple-service-secret
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
