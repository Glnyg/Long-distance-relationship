apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aiapp-postgres
  namespace: aiapp
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: aiapp
spec:
  # StatefulSet 适合有状态组件；Pod 重建后会继续挂载原来的数据卷。
  serviceName: aiapp-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: aiapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: aiapp
    spec:
      serviceAccountName: aiapp-workload
      containers:
        - name: postgres
          # postgis 镜像包含 PostgreSQL 和地理空间扩展，用来支撑位置轨迹查询。
          image: postgis/postgis:16-3.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                # 数据库名、用户名、密码都从 Secret 注入，不写在镜像或命令里。
                name: aiapp-postgres-secret
          readinessProbe:
            # readinessProbe 通过后，Kubernetes 才会把流量发给这个 Pod。
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            # livenessProbe 失败时，Kubernetes 会尝试重启 Pod。
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: postgres-data
              # 数据库文件必须放在持久卷里，Pod 重启不能丢数据。
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            # 这里是首版保守资源，生产环境要按压测结果调整。
            storage: 20Gi
