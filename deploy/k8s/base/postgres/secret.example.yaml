apiVersion: v1
kind: Secret
metadata:
  name: aiapp-postgres-secret
  namespace: aiapp
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: aiapp
type: Opaque
stringData:
  # 这些是示例值。真实环境不能使用 CHANGE_ME，也不能把真实密码提交到 Git。
  POSTGRES_DB: aiapp
  POSTGRES_USER: aiapp
  POSTGRES_PASSWORD: CHANGE_ME_POSTGRES_PASSWORD
