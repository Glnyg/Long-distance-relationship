name: CI

on:
  # PR 和推送都跑同一套门禁，保证本地规则和远端规则一致。
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  project-gate:
    name: Project gate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        # 服务端按 .NET 10 设计，CI 必须固定到同一主版本。
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run project gate
        # 总门禁会串起文档、隐私日志、可观测性、部署、构建和测试。
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/Assert-ProjectGate.ps1
